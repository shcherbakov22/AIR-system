<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Look Extension</title>
    <style>
      body { margin: 10px; width: 320px; font-family: Arial, sans-serif; }
      input { width: 100%; padding: 8px; box-sizing: border-box; }
      button { width: 100%; padding: 10px; margin-top: 8px; }
      #status { margin-top: 10px; white-space: pre-wrap; font-size: 13px; }
      video { width: 1px; height: 1px; opacity: 0; position: absolute; left: -9999px; }
    </style>
  </head>
  <body>
    <button id="startbg">Start background detection</button>
    <button id="recalibrate">Recalibrate baseline</button>

    <div id="status">Status: -</div>

    <!-- hidden video only used to trigger camera permission -->
    <video id="permVideo" autoplay playsinline muted></video>

    <script src="popup.js"></script>
  </body>
</html>
